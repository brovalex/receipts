version: '3.8'
services:
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=receipts_app
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  price_scraper:
    build: 
      context: ./services/price_scraper
    volumes:
      - ./services/price_scraper:/app
  # db not implemented yet
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres@db:5432/price_scraper
  #   depends_on: 
  #     - db

volumes:
  postgres_data: