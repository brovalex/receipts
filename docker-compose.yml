version: '3.8'
services:
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=receipts_app
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  price_scraper:
    build: 
      context: ./services/price_scraper
    volumes:
      - ./services/price_scraper:/app

volumes:
  postgres_data: